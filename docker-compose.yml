version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: book_bloom_db_mssql
    restart: always
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: CineBook@1234
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
      - ./database/init:/init
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "CineBook@1234" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: BookAndBloom
        APP_ENV: local
        APP_KEY: base64:/s9n3fdu8pp+3uqPzBOpjWsXQJ7xUalmJaR3/qadmds=
        APP_DEBUG: "false"
        APP_URL: http://localhost
        FRONTEND_URL: http://localhost
        LOG_LEVEL: debug
        DB_CONNECTION: sqlsrv
        DB_HOST: db
        DB_PORT: 1433
        DB_DATABASE: smart_library
        DB_USERNAME: sa
        DB_PASSWORD: CineBook@1234
        VITE_BACKEND_ENDPOINT: http://localhost
        SESSION_DRIVER: file
        CACHE_DRIVER: file
    container_name: book_bloom_app_mssql
    restart: always
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: